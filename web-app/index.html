<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="HealthArchive — Sistema de Historias Clínicas" />
    <!--
      El traductor automático del navegador reescribe el texto de las evoluciones: un
      médico escribió "BIRD" (bloqueo incompleto de rama derecha) y se guardó "pájaro".
      No es solo visual: el editor es un contentEditable y draft-js toma el texto
      traducido como si lo hubiera tipeado el usuario, así que termina en la base.
      Este meta desactiva la traducción en toda la app.
    -->
    <meta name="google" content="notranslate" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>HealthArchive</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
