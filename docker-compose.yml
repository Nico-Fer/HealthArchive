version: '3.8'

services:
  # Base de datos SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: healtharchive-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=HealthArchive123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - healtharchive-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P HealthArchive123! -Q "SELECT 1" -C || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Backend API .NET
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: healtharchive-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DbContext=Server=sqlserver,1433;Database=HealthArchive;User Id=sa;Password=HealthArchive123!;TrustServerCertificate=True;
    ports:
      - "5000:80"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - healtharchive-network
    healthcheck:
      test: curl -f http://localhost/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: healtharchive-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - healtharchive-network
    healthcheck:
      test: wget -q -O- http://localhost/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Reverse Proxy con nginx (opcional pero recomendado)
  nginx:
    image: nginx:alpine
    container_name: healtharchive-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx-proxy.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
      - frontend
    networks:
      - healtharchive-network
    healthcheck:
      test: wget -q -O- http://localhost/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sqlserver_data:
    driver: local

networks:
  healtharchive-network:
    driver: bridge